services:
  # Named volumes mount as root; ensure the shared SQLite dir is writable by nextjs (1001).
  db-init:
    build:
      context: .
      target: builder
    command: chown -R 1001:1001 /app/data
    user: "0:0"
    volumes:
      - snippet-data:/app/data
    restart: "no"

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:deploy
    user: "1001:1001"
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - snippet-data:/app/data
    restart: "no"

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - snippet-data:/app/data
    restart: unless-stopped

volumes:
  snippet-data:
